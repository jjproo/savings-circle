<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Savings Circle</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f5f6ef; color: #18291f; font: 16px/1.5 system-ui, sans-serif }
    main { width: min(100%, 420px); padding: clamp(22px, 7vw, 36px); border: 1px solid #e0e5d9; border-radius: 20px; background: #fff }
    .brand { font-size: .8rem; color: #3e6249; font-weight: 750; letter-spacing: .12em; text-transform: uppercase }
    h1 { margin: .5rem 0; font-size: 2rem; letter-spacing: -.045em }
    p { margin: 0 0 1.35rem; color: #536459 }
    label { display: block; margin-bottom: .35rem; font-weight: 650 }
    input, button { width: 100%; min-height: 44px; font: inherit; padding: .55rem .75rem; border-radius: 8px }
    input { border: 1px solid #829588 }
    button { margin-top: 1rem; border: 1px solid #d9f780; background: #d9f780; color: #193520; font-weight: 750; cursor: pointer }
    :focus-visible { outline: 3px solid #568838; outline-offset: 3px }
    [role="alert"] { margin: .75rem 0 0; color: #a12d27 }
  </style>
</head>
<body>
  <main>
    <div class="brand">Savings Circle</div>
    <h1>Sign in</h1>
    <p>Use your accountant or member access code to open the savings ledger.</p>
    <form action="/login" method="post">
      <label for="code">Access code</label>
      <input id="code" name="code" type="password" autocomplete="current-password" maxlength="64" required>
      {{notice}}
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
